name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Casino.slnx
      - run: dotnet build Casino.slnx --no-restore -c Release -warnaserror
      - run: dotnet test Casino.slnx --no-build -c Release
      - run: dotnet format Casino.slnx --verify-no-changes --no-restore
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test "tests/web/*.test.mjs"
