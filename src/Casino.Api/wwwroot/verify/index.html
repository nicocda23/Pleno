<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verificar jugada</title>
  <style>
    :root { --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5b6672; --line: #d8dde3; --ok: #1a7f37; --bad: #c62828; --accent: #2457c5; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1318; --card: #181e26; --text: #e8ecf1; --muted: #9aa6b4; --line: #2b3441; --ok: #4cc26a; --bad: #ff6b6b; --accent: #7aa2ff; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    p.lead { color: var(--muted); margin: 0 0 20px; }
    form, #result { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    label { display: block; font-weight: 600; margin: 12px 0 4px; }
    small { color: var(--muted); font-weight: 400; }
    input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: inherit; font: inherit; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 480px) { .row { grid-template-columns: 1fr; } }
    button { margin-top: 16px; padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    #result { margin-top: 16px; }
    #result[hidden] { display: none; }
    li { margin: 6px 0; }
    .ok { color: var(--ok); font-weight: 600; }
    .bad { color: var(--bad); font-weight: 600; }
    code { word-break: break-all; font-size: 0.85em; }
  </style>
</head>
<body>
  <main>
    <h1>Verificar una jugada</h1>
    <p class="lead">Todo se calcula en tu navegador: nada de lo que escribas sale de esta página. Necesitás la server seed
      <strong>revelada</strong> (se muestra al rotar tus seeds).</p>

    <form id="form" autocomplete="off">
      <label for="commitment">Compromiso <small>(huella publicada antes de jugar)</small></label>
      <input id="commitment" required pattern="[0-9a-fA-F]{64}" placeholder="64 caracteres hexadecimales">

      <label for="serverSeed">Server seed revelada</label>
      <input id="serverSeed" required placeholder="64 caracteres hexadecimales">

      <div class="row">
        <div>
          <label for="clientSeed">Client seed</label>
          <input id="clientSeed" required maxlength="64">
        </div>
        <div>
          <label for="nonce">Nonce de la apuesta</label>
          <input id="nonce" type="number" min="0" step="1" required>
        </div>
      </div>

      <label for="claimed">Número que salió <small>(0 a 36)</small></label>
      <input id="claimed" type="number" min="0" max="36" step="1" required>

      <button type="submit">Verificar</button>
    </form>

    <section id="result" hidden aria-live="polite"></section>
  </main>

  <script type="module">
    import { parsePrefill, verifyRound } from "./verify.js";

    const form = document.getElementById("form");
    const result = document.getElementById("result");
    const escapeHtml = (text) => text.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

    async function run() {
      const input = {
        commitment: document.getElementById("commitment").value.trim(),
        serverSeed: document.getElementById("serverSeed").value.trim(),
        clientSeed: document.getElementById("clientSeed").value,
        nonce: Number(document.getElementById("nonce").value),
        claimedNumber: Number(document.getElementById("claimed").value),
      };
      const check = await verifyRound(input);
      const mark = (ok) => (ok ? '<span class="ok">&#10003; Correcto</span>' : '<span class="bad">&#10007; No coincide</span>');
      result.hidden = false;
      result.innerHTML = `
        <h2>${check.ok ? '<span class="ok">La jugada es legítima</span>' : '<span class="bad">La jugada NO se pudo verificar</span>'}</h2>
        <ol>
          <li><strong>La seed revelada es la que se comprometió:</strong> ${mark(check.commitmentOk)}<br>
            <small>SHA-256 de la seed: <code>${escapeHtml(check.computedCommitment)}</code></small></li>
          <li><strong>El número recalculado coincide:</strong> ${mark(check.numberOk)}<br>
            <small>Recalculado: <strong>${check.recomputed}</strong> &middot; informado: <strong>${input.claimedNumber}</strong></small></li>
        </ol>`;
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      void run();
    });

    // Si llegas desde el historial del casino, los datos vienen en la URL: se completan y se verifica de inmediato.
    const prefill = parsePrefill(window.location.search);
    if (prefill) {
      document.getElementById("commitment").value = prefill.commitment;
      document.getElementById("serverSeed").value = prefill.serverSeed;
      document.getElementById("clientSeed").value = prefill.clientSeed;
      document.getElementById("nonce").value = prefill.nonce;
      document.getElementById("claimed").value = prefill.claimedNumber;
      void run();
    }
  </script>
</body>
</html>
